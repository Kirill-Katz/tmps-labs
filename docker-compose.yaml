services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: tmps
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d tmps"]
            interval: 5s
            timeout: 5s
            retries: 10

    kafka:
        image: apache/kafka:4.2.2
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
            CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
        volumes:
            - kafka_data:/tmp/kraft-combined-logs
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 20
            start_period: 20s

    backend:
        build: .
        ports:
            - "8080:8080"
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tmps
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres
            SPRING_JPA_HIBERNATE_DDL_AUTO: validate
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
            SPRING_KAFKA_CONSUMER_GROUP_ID: transaction-workers
            SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy

    worker:
        build: .
        command:
            - java
            - -jar
            - app.jar
            - --spring.main.web-application-type=none
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tmps
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres
            SPRING_JPA_HIBERNATE_DDL_AUTO: validate
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
            SPRING_KAFKA_CONSUMER_GROUP_ID: transaction-workers
            SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        profiles:
            - workers

volumes:
    postgres_data:
    kafka_data:
